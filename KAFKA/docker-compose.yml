version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  eureka-server:
    build:
      context: ./eureka-server
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: ${EUREKA_SERVER_PORT:-8761}

  auth-service:
    build:
      context: ./auth-service
    ports:
      - "9090:9090"
    environment:
      SERVER_PORT: ${AUTH_SERVICE_PORT:-9090}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:-http://eureka-server:8761/eureka/}
    depends_on:
      - eureka-server

  order-service:
    build:
      context: ./order
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: ${ORDER_SERVICE_PORT:-8081}
      AUTH_SERVICE_VALIDATE_URL: ${AUTH_SERVICE_VALIDATE_URL:-http://auth-service:9090/auth/validate}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-http://payment-service:8083}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL:-http://inventory-service:8082}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:-http://eureka-server:8761/eureka/}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    depends_on:
      - eureka-server
      - auth-service
      - payment-service
      - inventory-service
      - kafka

  inventory-service:
    build:
      context: ./inventory
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: ${INVENTORY_SERVICE_PORT:-8082}
      AUTH_SERVICE_VALIDATE_URL: ${AUTH_SERVICE_VALIDATE_URL:-http://auth-service:9090/auth/validate}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:-http://eureka-server:8761/eureka/}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}

  payment-service:
    build:
      context: ./payment
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: ${PAYMENT_SERVICE_PORT:-8083}
      AUTH_SERVICE_VALIDATE_URL: ${AUTH_SERVICE_VALIDATE_URL:-http://auth-service:9090/auth/validate}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:-http://eureka-server:8761/eureka/}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}

  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "9091:9091"
    environment:
      SERVER_PORT: ${API_GATEWAY_PORT:-9091}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:-http://eureka-server:8761/eureka/}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:9090}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL:-http://order-service:8081}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL:-http://inventory-service:8082}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-http://payment-service:8083}
    depends_on:
      - eureka-server
      - auth-service
      - order-service
      - inventory-service
      - payment-service
