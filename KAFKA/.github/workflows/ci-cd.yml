name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build auth-service
        run: cd auth-service && mvn test

      - name: Build order service
        run: cd order && mvn test

      - name: Build inventory service
        run: cd inventory && mvn test

      - name: Build payment service
        run: cd payment && mvn test

      - name: Build api gateway
        run: cd api-gateway && mvn test
